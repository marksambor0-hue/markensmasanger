name: Build MARKENS Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable app
        run: npm run dist

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: MARKENS-Windows-x64-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
