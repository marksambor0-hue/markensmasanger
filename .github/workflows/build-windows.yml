name: Build & Publish MARKENS Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so two runs do not try to publish the same version at once.
concurrency:
  group: markens-windows-release
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Test, build and publish MARKENS
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare project structure and icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          if ((Test-Path "icon.ico") -and -not (Test-Path "assets/icon.ico")) {
            Copy-Item "icon.ico" "assets/icon.ico" -Force
          } elseif ((Test-Path "assets/icon.ico") -and -not (Test-Path "icon.ico")) {
            Copy-Item "assets/icon.ico" "icon.ico" -Force
          }
          if ((Test-Path "icon.png") -and -not (Test-Path "assets/icon.png")) {
            Copy-Item "icon.png" "assets/icon.png" -Force
          } elseif ((Test-Path "assets/icon.png") -and -not (Test-Path "icon.png")) {
            Copy-Item "assets/icon.png" "icon.png" -Force
          }

          $required = @('package.json', 'main.js', 'preload.js', 'index.html', 'icon.ico', 'scripts/verify-build.js')
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing required MARKENS file: $f"
              exit 1
            }
          }
          Write-Host "Required MARKENS files are present."

      - name: Calculate next release version
        id: release_version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const packagePath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            const parse = (value) => {
              const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(value || '').trim());
              return match ? match.slice(1).map(Number) : null;
            };
            const compare = (left, right) => {
              for (let i = 0; i < 3; i++) {
                if (left[i] !== right[i]) return left[i] - right[i];
              }
              return 0;
            };

            const packageVersion = String(pkg.version || '');
            const packageParts = parse(packageVersion);
            if (!packageParts) throw new Error('Invalid package.json version: ' + packageVersion);

            let latestReleaseTag = null;
            try {
              const response = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestReleaseTag = response.data && response.data.tag_name ? response.data.tag_name : null;
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No published release exists yet; using package.json as the starting version.');
            }

            const releaseParts = parse(latestReleaseTag);
            if (latestReleaseTag && !releaseParts) {
              throw new Error('Cannot calculate next version from latest release tag: ' + latestReleaseTag);
            }
            // Never regress to an older release line when package.json is ahead of GitHub Releases.
            const useRelease = releaseParts && compare(releaseParts, packageParts) > 0;
            const baseVersion = useRelease ? releaseParts : packageParts;
            const nextVersion = baseVersion[0] + '.' + baseVersion[1] + '.' + (baseVersion[2] + 1);
            pkg.version = nextVersion;
            fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

            const htmlPath = 'index.html';
            let html = fs.readFileSync(htmlPath, 'utf8');
            const versionPattern = /const\s+CURRENT_SCRIPT_VERSION\s*=\s*["']v?[^"']+["']\s*;/;
            const timestampPattern = /const\s+CURRENT_SCRIPT_TS\s*=\s*\d+\s*;/;
            if (!versionPattern.test(html)) throw new Error('CURRENT_SCRIPT_VERSION was not found in index.html');
            if (!timestampPattern.test(html)) throw new Error('CURRENT_SCRIPT_TS was not found in index.html');
            html = html.replace(versionPattern, 'const CURRENT_SCRIPT_VERSION = "v' + nextVersion + '";');
            html = html.replace(timestampPattern, 'const CURRENT_SCRIPT_TS = ' + Date.now() + ';');
            fs.writeFileSync(htmlPath, html);

            core.setOutput('version', nextVersion);
            core.setOutput('tag', 'v' + nextVersion);
            core.info('Next MARKENS release: v' + nextVersion + ' (higher of package.json and latest GitHub Release, then patch + 1).');

      - name: Install dependencies
        run: npm install

      - name: Run MARKENS checks
        run: npm test

      - name: Build installer and publish GitHub Release with updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Verify generated installer and update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MARKENS_Setup.exe")) {
            Write-Error "MARKENS_Setup.exe was not generated."
            exit 1
          }
          if (-not (Test-Path "dist/latest.yml")) {
            Write-Error "latest.yml was not generated; auto-update metadata is missing."
            exit 1
          }
          Get-Item "dist/MARKENS_Setup.exe" | ForEach-Object {
            Write-Host ("Installer: {0} ({1} MB)" -f $_.Name, [math]::Round($_.Length / 1MB, 2))
          }
          Write-Host "Updater metadata latest.yml is present."

      - name: Keep installer available in Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MARKENS_Setup.exe
          path: dist/MARKENS_Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Keep updater metadata available for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: MARKENS_Update_Metadata
          path: |
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 90
