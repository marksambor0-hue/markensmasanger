name: Build MARKENS Windows EXE (x64)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build MARKENS_Setup.exe on Windows Runner (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare and verify project structure & icons
        shell: pwsh
        run: |
          # If someone uploaded a zip bundle to the root without unpacking, extract missing Electron files automatically
          if (-not (Test-Path 'package.json')) {
            $zipFile = Get-ChildItem -Path . -Filter *.zip | Select-Object -First 1
            if ($zipFile) {
              Write-Host "Extracting missing project files from $($zipFile.Name)..."
              Expand-Archive -Path $zipFile.FullName -DestinationPath . -Force
            }
          }

          # Normalize icon locations so both root icon.ico/icon.png and assets/icon.ico/icon.png exist
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          if ((Test-Path "icon.ico") -and -not (Test-Path "assets/icon.ico")) {
            Copy-Item "icon.ico" "assets/icon.ico" -Force
          } elseif ((Test-Path "assets/icon.ico") -and -not (Test-Path "icon.ico")) {
            Copy-Item "assets/icon.ico" "icon.ico" -Force
          }
          if ((Test-Path "icon.png") -and -not (Test-Path "assets/icon.png")) {
            Copy-Item "icon.png" "assets/icon.png" -Force
          } elseif ((Test-Path "assets/icon.png") -and -not (Test-Path "icon.png")) {
            Copy-Item "assets/icon.png" "icon.png" -Force
          }

          $required = @('package.json', 'main.js', 'preload.js', 'index.html', 'icon.ico')
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing required file in repository root: $f"
              exit 1
            }
          }
          Write-Host "All required MARKENS v30.1 files verified."

      - name: Install dependencies
        run: npm install

      - name: Build MARKENS_Setup.exe & MARKENS_Portable.exe (Windows 10/11 x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Verify compiled MARKENS_Setup.exe
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter *.exe | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "Compiled EXE: $($_.Name) ($sizeMB MB)"
          }
          if (-not (Test-Path "dist/MARKENS_Setup.exe")) {
            Write-Error "MARKENS_Setup.exe was not generated!"
            exit 1
          }

      - name: Upload MARKENS_Setup.exe to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MARKENS_Setup.exe
          path: dist/MARKENS_Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload MARKENS_Portable.exe to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MARKENS_Portable.exe
          path: dist/MARKENS_Portable.exe
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to GitHub Releases (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MARKENS_Setup.exe
            dist/MARKENS_Portable.exe
          generate_release_notes: true
